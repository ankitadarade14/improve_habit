<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Improve Habits</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <nav class="navbar">
        <div class="logo">Improve Habits</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="signup.html">Sign Up</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-card">
            <h1>Welcome Back</h1>
            <p class="auth-subtitle">Login to your account</p>

            <label>Email</label>
            <input type="email" id="loginEmail" placeholder="Enter your email">

            <label>Password</label>
            <input type="password" id="loginPassword" placeholder="Enter your password">

            <button class="auth-button" onclick="login()">Login</button>

            <div class="auth-footer">
                <p>Don't have account? <a href="signup.html">Sign Up here</a></p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBTMMoDy0zZuKBQ_fsJsn0JqY7OHfmZHWU",
            authDomain: "improve-habits.firebaseapp.com",
            projectId: "improve-habits",
            storageBucket: "improve-habits.firebasestorage.app",
            messagingSenderId: "576467986044",
            appId: "1:576467986044:web:052ec7fc1d00344ea20bf9",
            measurementId: "G-JSBR4T295F"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.login = function () {
            const email = document.getElementById("loginEmail").value;
            const password = document.getElementById("loginPassword").value;

            if (!email || !password) {
                alert("Please fill all fields");
                return;
            }

            signInWithEmailAndPassword(auth, email, password)
                .then((userCredential) => {
                    alert("Login successful!");
                    window.location.href = "dashboard.html";
                })
                .catch((error) => {
                    alert("Error: " + error.message);
                });
        };
    </script>

</body>

</html>
